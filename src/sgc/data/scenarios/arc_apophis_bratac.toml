when = ["arc apophis stage == 3", "trust jaffa >= 25", "not ally.jaffa"]

[node.start]
text.full = "{team} checks in from {world} with a guest: an old Jaffa master, Bra'tac, who trained Teal'c. Apophis's fleet sails for Earth within days, he says, and the Jaffa who follow Teal'c will stand with us."
