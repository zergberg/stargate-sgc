id = "naquadah_bomb"
kind = "incoming"
weight = 2
when = ["day >= 5"]
visual = ["incoming", "bomb"]

[node.start]
text.full = "Something came through before the iris closed. A device on the ramp, naquadah readings off the scale. The markings on the casing match nothing in our records."
text.partial = "An object came through before the iris closed. Naquadah readings."
text.minimal = "An object came through the gate."
situation = "object"
default = "seal"

[[node.start.choice]]
key = "seal"
label = "Seal the level"
outcome = { effects = ["breach 15", "personnel -5"], end = true }

[[node.start.choice]]
key = "push_back"
label = "Dial out, push it back through"
[node.start.choice.outcome.roll]
odds = 55
mods = ["tech.naquadah_generator +10", "personnel >= 50 +10"]
[node.start.choice.outcome.roll.win]
effects = ["security +5"]
end = true
[node.start.choice.outcome.roll.lose]
effects = ["game_over The device detonated in the gate room. Cheyenne Mountain is gone."]
