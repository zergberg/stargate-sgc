id = "checkin_patrol"
kind = "checkin"
mission_type = "survey"
weight = 4
when = ["world {world} inhabitants jaffa"]

[node.start]
text.full = "{team} checks in from {world} under staff-weapon fire: a Jaffa patrol found their camp."
text.minimal = "{team} is under fire."
situation = "under_fire"
default = "recall"

[[node.start.choice]]
key = "recall"
label = "Recall them"
outcome = { effects = ["recall {team}"], end = true }

[[node.start.choice]]
key = "hold"
label = "Hold position"
[node.start.choice.outcome.roll]
odds = 50
mods = ["team {team} specialty combat +20", "tech.zat +10"]
[node.start.choice.outcome.roll.win]
effects = ["xp {team} +1"]
end = true
[node.start.choice.outcome.roll.lose]
effects = ["team {team} captured"]
end = true

[[node.start.choice]]
key = "reinforce"
label = "Reinforce if a team is available"
requires = ["team_available"]
[node.start.choice.outcome.roll]
odds = 80
[node.start.choice.outcome.roll.win]
effects = ["reinforce {team}"]
end = true
[node.start.choice.outcome.roll.lose]
effects = ["reinforce {team}", "team {team} injured"]
end = true
