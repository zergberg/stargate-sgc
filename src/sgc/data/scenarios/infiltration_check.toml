id = "infiltration_check"
kind = "incoming"
weight = 2
team = "base"
when = ["cycles >= 3"]

[node.start]
text.full = "Dr. Fraiser: one of {team}'s returning members has elevated naquadah in the blood. It could be a symbiote."
text.partial = "Dr. Fraiser flags an anomaly in {team}'s post-mission physicals."
text.minimal = "Dr. Fraiser asks for a word about {team}."
default = "quarantine"

[[node.start.choice]]
key = "mri"
label = "Full MRI screening"
outcome = { effects = ["team {team} injured", "intel +5"], end = true }

[[node.start.choice]]
key = "quarantine"
label = "Quarantine the team"
outcome = { effects = ["team {team} injured", "security +5"], end = true }

[[node.start.choice]]
key = "clear"
label = "Clear them for duty"
[node.start.choice.outcome.roll]
odds = 70
[node.start.choice.outcome.roll.win]
end = true
[node.start.choice.outcome.roll.lose]
effects = ["idc {team} compromise", "breach 15"]
end = true
