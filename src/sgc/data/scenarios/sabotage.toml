id = "sabotage"
kind = "mission"
mission_type = "sabotage"
weight = 4
goauld = "any"
risk = "high"
when = ["goauld {goauld} strength >= 2"]
brief = "Sabotage {goauld}'s shipyard at {destination}"

[node.start]
text.full = "{team} has C-4 and a way into {goauld}'s shipyard."
default = "abort"

[[node.start.choice]]
key = "plant"
label = "Plant the charges"
[node.start.choice.outcome.roll]
odds = 50
mods = ["intel >= 30 +15", "ally.tokra +10", "tech.zat +5"]
[node.start.choice.outcome.roll.win]
visual = "team_return"
effects = ["goauld {goauld} strength -1", "goauld {goauld} aggression +15"]
end = true
[node.start.choice.outcome.roll.lose]
goto = "chase"

[[node.start.choice]]
key = "abort"
label = "Too risky; pull out"
outcome = { visual = "team_return", end = true }

[node.chase]
text.full = "The charges were found. Jaffa are searching the shipyard for {team}."
default = "hide"

[[node.chase.choice]]
key = "run"
label = "Run for the gate"
[node.chase.choice.outcome.roll]
odds = 55
mods = ["tech.zat +15"]
[node.chase.choice.outcome.roll.win]
visual = "team_return"
effects = ["goauld {goauld} aggression +10"]
end = true
[node.chase.choice.outcome.roll.lose]
effects = ["team {team} captured", "goauld {goauld} aggression +10"]
end = true

[[node.chase.choice]]
key = "hide"
label = "Go to ground and wait it out"
[node.chase.choice.outcome.roll]
odds = 65
[node.chase.choice.outcome.roll.win]
visual = "team_return"
end = true
[node.chase.choice.outcome.roll.lose]
effects = ["team {team} lost"]
end = true
