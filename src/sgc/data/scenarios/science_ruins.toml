weight = 3
risk = "low"
brief = "Survey Ancient ruins on {destination}"

[node.start]
text.full = "{team} found Ancient writing on {destination}. Dr. Jackson is asking for more time."
default = "home"

[[node.start.choice]]
key = "stay"
label = "Give him another day"
[node.start.choice.outcome.roll]
odds = 80
[node.start.choice.outcome.roll.win]
