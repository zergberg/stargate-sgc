id = "debrief_garrison"
kind = "debrief"
mission_type = "survey"
weight = 10
when = ["world {world} inhabitants jaffa"]

[node.start]
text.full = "{team} debrief: {world} is a Jaffa garrison world. {team} listened in on the patrols long enough to learn what the Jaffa call it."
