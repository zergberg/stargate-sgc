id = "jaffa_incursion"
kind = "incoming"
weight = 2
when = ["day >= 3"]
visual = "incoming"

[node.start]
text.full = "Incoming wormhole, no IDC. Something is already hammering the iris from the other side. Staff-weapon fire, by the sound of it."
text.partial = "Incoming wormhole, no IDC. Impacts on the iris."
text.minimal = "Unscheduled offworld activation."
situation = "unknown_idc"
default = "closed"

[[node.start.choice]]
key = "closed"
label = "Keep the iris closed"
outcome = { visual = "iris_hold", effects = ["security -5"], end = true }

[[node.start.choice]]
key = "open_guarded"
label = "Open for 30 seconds under guard"
[node.start.choice.outcome.roll]
odds = 30
mods = ["tech.zat +15", "ally.jaffa +20", "security < 30 -15"]
[node.start.choice.outcome.roll.win]
visual = "firefight_win"
effects = ["personnel -15", "breach 20"]
end = true
[node.start.choice.outcome.roll.lose]
visual = "firefight"
effects = ["game_over Jaffa held the gate room long enough for an army to follow them through."]
