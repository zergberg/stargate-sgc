id = "steal_tech"
kind = "mission"
mission_type = "tech"
weight = 2
goauld = "any"
risk = "high"
when = ["not tech.naquadah_generator"]
brief = "Steal a power core from {goauld}'s ha'tak at {destination}"

[node.start]
text.full = "{team} is aboard the ha'tak. The power core is guarded by two Jaffa."
default = "abort"

[[node.start.choice]]
key = "take"
label = "Take the core"
[node.start.choice.outcome.roll]
odds = 45
mods = ["tech.zat +15", "intel >= 30 +10"]
[node.start.choice.outcome.roll.win]
visual = "team_return"
effects = ["gain tech.naquadah_generator", "goauld {goauld} aggression +10"]
end = true
[node.start.choice.outcome.roll.lose]
effects = ["team {team} captured", "goauld {goauld} aggression +5"]
end = true

[[node.start.choice]]
key = "abort"
label = "Abort and slip away"
outcome = { visual = "team_return", end = true }
