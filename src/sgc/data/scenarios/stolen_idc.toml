id = "stolen_idc"
kind = "incoming"
weight = 4
team = "compromised"
when = ["any_compromised_idc"]
visual = "incoming"

[node.start]
text.full = "Incoming wormhole. IDC received: {team}'s code. {team} was taken on {captured_at} and hasn't come home."
text.partial = "Incoming wormhole. IDC received: {team}."
text.minimal = "Incoming wormhole. IDC received."
situation = "bad_idc"
default = "closed_alert"

[[node.start.choice]]
key = "closed_alert"
label = "Keep closed, revoke the code"
outcome = { visual = "iris_hold", effects = ["idc {team} revoke", "security -2"], end = true }

[[node.start.choice]]
key = "closed_silent"
label = "Keep closed, say nothing"
outcome = { visual = "iris_hold", end = true }

[[node.start.choice]]
key = "open"
label = "Open the iris: it might really be them"
[node.start.choice.outcome.roll]
odds = 35
[node.start.choice.outcome.roll.win]
visual = "arrival"
effects = ["team {team} base"]
end = true
[node.start.choice.outcome.roll.lose]
visual = "firefight"
effects = ["breach 30", "personnel -10"]
end = true
