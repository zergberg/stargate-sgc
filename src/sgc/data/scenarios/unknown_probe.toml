id = "unknown_probe"
kind = "incoming"
weight = 2
visual = "incoming"

[node.start]
text.full = "A small probe rolled through before the iris closed. It isn't one of ours. It's scanning the gate room."
text.minimal = "An object came through the gate."
situation = "object"
default = "seal"

[[node.start.choice]]
key = "seal"
label = "Seal the level"
outcome = { effects = ["security -5"], end = true }

[[node.start.choice]]
key = "push_back"
label = "Dial out, push it back through"
[node.start.choice.outcome.roll]
odds = 70
[node.start.choice.outcome.roll.win]
effects = ["reveal address"]
end = true
[node.start.choice.outcome.roll.lose]
effects = ["breach 10"]
end = true
