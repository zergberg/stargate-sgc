id = "wounded_team"
kind = "incoming"
weight = 3
team = "base"
when = ["cycles >= 2"]
visual = "incoming"

[node.start]
text.full = "{team} is coming home early and under fire. Two wounded, and Jaffa right behind them."
text.partial = "{team}'s IDC. Weapons fire audible through the wormhole."
text.minimal = "IDC received. Weapons fire audible through the wormhole."
default = "wait"

[[node.start.choice]]
key = "cover"
label = "Open the iris and cover them"
[node.start.choice.outcome.roll]
odds = 65
mods = ["tech.zat +15", "ally.jaffa +10"]
[node.start.choice.outcome.roll.win]
visual = "arrival"
effects = ["personnel -5", "team {team} injured"]
end = true
[node.start.choice.outcome.roll.lose]
visual = "arrival"
goto = "fight"

[[node.start.choice]]
key = "wait"
label = "Wait for them to break contact, then open"
outcome = { visual = "arrival", effects = ["personnel -10", "team {team} injured"], end = true }

[[node.start.choice]]
key = "close"
label = "Close the iris"
outcome = { visual = "iris_hold", effects = ["team {team} lost"], end = true }

[node.fight]
text.full = "Jaffa followed {team} through the gate!"
default = "fall_back"

[[node.fight.choice]]
key = "hold"
label = "Hold the gate room"
[node.fight.choice.outcome.roll]
odds = 55
mods = ["tech.zat +15", "ally.jaffa +20", "personnel < 40 -15"]
[node.fight.choice.outcome.roll.win]
visual = "firefight_win"
effects = ["personnel -10", "team {team} injured"]
end = true
[node.fight.choice.outcome.roll.lose]
visual = "firefight"
effects = ["game_over The Jaffa who followed {team} home took the SGC."]

[[node.fight.choice]]
key = "fall_back"
label = "Get the wounded out and seal the room"
outcome = { visual = "firefight", effects = ["breach 25", "team {team} injured"], end = true }
