id = "arc_tokra_wake_garrison"
kind = "debrief"
weight = 6
when = ["world {world} inhabitants jaffa", "arc tokra dormant", "day >= 8"]

[node.start]
text.full = "{team} debrief: a Jaffa on {world} broke ranks long enough to press a clay tablet into the hand of {team}'s leader: glyphs for an address, and one word scratched beneath them, Tok'ra."
text.minimal = "{team} debrief: a Jaffa passed us an address."
default = "file"

[[node.start.choice]]
key = "file"
label = "File the report"
outcome = { effects = ["arc tokra start", "reveal address @Vorash", "unlock contact @Vorash"], end = true }
