id = "ally_asgard"
kind = "mission"
mission_type = "ally"
weight = 2
risk = "medium"
when = ["not ally.asgard", "intel >= 25"]
brief = "Search for the Asgard outpost on {destination}"

[node.start]
text.full = "{team} has found a sealed Asgard chamber. The test inside looks dangerous."
default = "leave"

[[node.start.choice]]
key = "test"
label = "Take the Asgard test"
[node.start.choice.outcome.roll]
odds = 50
mods = ["intel >= 40 +15"]
[node.start.choice.outcome.roll.win]
visual = "team_return"
effects = ["gain ally.asgard"]
end = true
[node.start.choice.outcome.roll.lose]
visual = "team_return"
effects = ["team {team} injured"]
end = true

[[node.start.choice]]
key = "leave"
label = "Record everything and come home"
outcome = { visual = "team_return", effects = ["intel +5"], end = true }
