id = "ally_tollan"
kind = "mission"
mission_type = "diplomacy"
weight = 2
risk = "low"
when = ["not ally.tollan"]
brief = "Open talks with the Tollan on {destination}"

[node.start]
text.full = "The Tollan curia will hear {team}, but they don't trust Earth."
default = "leave"

[[node.start.choice]]
key = "talk"
label = "Make the case for an alliance"
[node.start.choice.outcome.roll]
odds = 55
mods = ["ally.tokra +10", "ally.nox +15"]
[node.start.choice.outcome.roll.win]
visual = "team_return"
effects = ["gain ally.tollan"]
end = true
[node.start.choice.outcome.roll.lose]
visual = "team_return"
effects = ["intel +5"]
end = true

[[node.start.choice]]
key = "leave"
label = "Thank them for their time"
outcome = { visual = "team_return", end = true }
