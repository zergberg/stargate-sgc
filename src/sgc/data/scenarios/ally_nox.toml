id = "ally_nox"
kind = "mission"
mission_type = "diplomacy"
weight = 2
risk = "low"
when = ["not ally.nox"]
brief = "Seek out the Nox on {destination}"

[node.start]
text.full = "The forest is silent. The Nox are watching {team}, but they won't show themselves."
default = "leave"

[[node.start.choice]]
key = "wait"
label = "Lay down arms and wait"
[node.start.choice.outcome.roll]
odds = 60
mods = ["ally.tollan +15"]
[node.start.choice.outcome.roll.win]
visual = "team_return"
effects = ["gain ally.nox"]
end = true
[node.start.choice.outcome.roll.lose]
visual = "team_return"
effects = ["intel +5"]
end = true

[[node.start.choice]]
key = "leave"
label = "Leave them in peace"
outcome = { visual = "team_return", end = true }
